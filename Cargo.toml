[package]
name = "apitally"
version = "0.1.0"
edition = "2021"
description = "Apitally middleware"
license = "MIT"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/chris-windsor/apitally-rs"

[dependencies]
axum = "0.7.9"
base64 = "0.22.1"
flate2 = "1.1.0"
futures = "0.3.31"
futures-util = "0.3.31"
mime = "0.3.17"
reqwest = { version = "0.12.10", features = ["json", "stream"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.140"
tempfile = "3.17.1"
tokio = { version = "1.42.0", features = ["full"] }
tower = "0.5.2"
uuid = { version = "1.15.1", features = ["serde", "v4"] }
